<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Manish Waghmare</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Specific styles for the 404 page to center everything */
        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background-color: var(--bg-main);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 1rem;
            font-family: var(--font-display);
        }

        .error-title {
            font-size: 2rem;
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-family: var(--font-display);
        }

        .error-message {
            font-size: 1.125rem;
            color: var(--text-light);
            max-width: 500px;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <main class="error-page reveal visible">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Oops! It looks like the page you are looking for doesn't exist, has been moved, or is temporarily unavailable.
        </p>
        <a href="index.html" class="btn btn-primary">
            Return to Homepage
        </a>
    </main>

</body>
</html>
